<!doctype html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Wherever you go, there you are</title>
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
              integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
              crossorigin=""/>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
                integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
                crossorigin=""></script>
    </head>
    <body>
        <form>
            <input type="button" id="watch" value="Watch me">
            <input type="button" id="clearWatch" value="Clear watch">
        </form>
        <div id="location">
            Your location will go here.
        </div>
        <div id="distance">
            Distance from College will go here.
        </div>

        <div id="destination">
            Destination:
            <input type="text" id="destLat" placeholder="Latitude, напр. 50.4486">
            <input type="text" id="destLng" placeholder="Longitude, напр. 30.5226">
            <input type="button" id="setDest" value="Set destination">
            <input type="button" id="goDest" value="Go to destination">
        </div>
        
        <div id="map" style="height: 500px;">

        </div>
        <script src="myLoc.js"></script>
    </body>
</html>
