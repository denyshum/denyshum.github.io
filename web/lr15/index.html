<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №15</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.js"></script>
</head>
<body>
    <main class="container">
        <header>
            <h1>Проєкти студії дизайну</h1>
        </header>

        <section aria-labelledby="auth-heading">
            <h2 id="auth-heading">Обліковий запис</h2>
            <p id="auth-status" role="status" aria-live="polite"></p>
            <div id="auth-forms">
                <form id="register-form">
                    <h3>Реєстрація</h3>
                    <label for="register-email">Електронна адреса</label>
                    <input id="register-email" type="email" autocomplete="email" required>
                    <label for="register-password">Пароль</label>
                    <input id="register-password" type="password" autocomplete="new-password" minlength="6" required>
                    <button type="submit">Зареєструватися</button>
                </form>
                <form id="login-form">
                    <h3>Вхід</h3>
                    <label for="login-email">Електронна адреса</label>
                    <input id="login-email" type="email" autocomplete="username" required>
                    <label for="login-password">Пароль</label>
                    <input id="login-password" type="password" autocomplete="current-password" required>
                    <button type="submit">Увійти</button>
                </form>
            </div>
            <div id="user-panel" hidden>
                <p id="user-info"></p>
                <button id="logout-button" type="button">Вийти</button>
            </div>
        </section>

        <section aria-labelledby="projects-heading">
            <h2 id="projects-heading">Наші проєкти</h2>
            <div class="controls">
                <div class="field">
                    <label for="search">Пошук за назвою</label>
                    <input id="search" type="search" placeholder="Введіть назву застосунку">
                </div>
                <div class="field">
                    <label for="category-filter">Категорія</label>
                    <select id="category-filter">
                        <option value="all">Усі категорії</option>
                        <option>Фінанси</option>
                        <option>Здоров’я</option>
                        <option>Освіта</option>
                        <option>Подорожі</option>
                    </select>
                </div>
                <div class="field">
                    <label for="sort">Сортування</label>
                    <select id="sort">
                        <option value="new">Нові спочатку</option>
                        <option value="old">Старі спочатку</option>
                        <option value="name-asc">За назвою: А–Я</option>
                        <option value="name-desc">За назвою: Я–А</option>
                    </select>
                </div>
            </div>
            <p id="status" role="status" aria-live="polite"></p>
            <ul id="projects-list"></ul>
        </section>

        <section id="admin-panel" aria-labelledby="form-heading" hidden>
            <h2 id="form-heading">Адміністративна частина</h2>
            <form id="project-form">
                <input id="project-id" type="hidden">
                <div class="field">
                    <label for="name">Назва застосунку</label>
                    <input id="name" name="name" required maxlength="150">
                </div>
                <div class="field">
                    <label for="category">Категорія</label>
                    <select id="category" name="category" required>
                        <option value="">Оберіть категорію</option>
                        <option>Фінанси</option>
                        <option>Здоров’я</option>
                        <option>Освіта</option>
                        <option>Подорожі</option>
                    </select>
                </div>
                <div class="field">
                    <label for="description">Опис проєкту</label>
                    <textarea id="description" name="description" rows="4" required maxlength="500"></textarea>
                </div>
                <button id="save-button" type="submit">Додати проєкт</button>
                <button id="cancel-button" type="button" hidden>Скасувати редагування</button>
            </form>
            <p id="form-status" role="status" aria-live="polite"></p>
        </section>
    </main>
</body>
</html>
